# Continuous integration: every push and pull request runs the full test suites, lint, the
# frontend build, the migrations against a fresh MySQL 8 database and a dependency audit.
# Nothing here touches production; secrets are generated per run by `npm run init:env`.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API (Node + MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          # Throwaway container reachable only from this job.
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: npm ci
      - name: AI service for the cross-language signature test
        working-directory: ai-service
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet -r requirements.txt
      - name: Generate secrets and database accounts for this run
        run: |
          npm run init:env
          # The runner reaches the container through the Docker gateway, not 127.0.0.1.
          sed -i "s/'127.0.0.1'/'%'/g" ../database/setup/setup.local.sql
          sed -i 's/^DB_APP_HOSTS=.*/DB_APP_HOSTS=localhost,%/' .env
          mysql -h 127.0.0.1 -u root < ../database/setup/setup.local.sql
      - name: Lint
        run: npm run lint
      - name: Migrations on a fresh database (twice, to prove they are idempotent)
        run: |
          npm run migrate
          npm run migrate
          npm run migrate:status
      - name: Demo data and audit chain
        run: |
          npm run seed:demo
          npm run audit:verify
      - name: Tests with coverage
        run: npx jest --runInBand --coverage --coverageReporters=text-summary

  frontend:
    name: Web app (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build

  ai-service:
    name: AI service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -p no:warnings --cov=app --cov-report=term
      - name: Known vulnerabilities in pinned packages
        run: pip-audit -r requirements.txt

  dependency-audit:
    name: npm audit (production packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=high
        working-directory: backend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
